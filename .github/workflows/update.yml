name: Update scanner
on:
  schedule:
    - cron: "*/30 3-9 * * 1-5"
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python thai_stock_scanner.py --no-open --refresh 900 --out site/index.html
      - uses: actions/upload-pages-artifact@v3
